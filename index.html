<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question ❤️</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            max-width: 90%;
            width: 360px;
            position: relative;
            box-sizing: border-box;
        }
        h1 {
            color: #ff4d6d;
            font-size: 1.8rem;
            margin: 0 0 10px 0;
        }
        p {
            color: #4a4a4a;
            font-size: 1.1rem;
            margin: 0 0 20px 0;
            min-height: 27px;
        }
        .img-container img {
            width: 180px;
            height: 180px;
            object-fit: cover; /* Keeps your custom photos perfectly cropped without stretching */
            margin-bottom: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .btn-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
        button {
            padding: 12px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            outline: none;
        }
        #yesBtn {
            background-color: #38b000;
            color: white;
            box-shadow: 0 5px 15px rgba(56, 176, 0, 0.4);
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #yesBtn.pulse {
            animation: pulseGlow 0.6s infinite alternate;
        }
        #noBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3);
            z-index: 99;
            transition: transform 0.1s ease;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 5px 15px rgba(56, 176, 0, 0.4); }
            100% { box-shadow: 0 5px 30px rgba(56, 176, 0, 0.9); }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="img-container">
            <!-- Points directly to your uploaded start image -->
            <img id="displayPhoto" src="us-start.jpg" alt="Our Photo">
        </div>
        <h1 id="questionHeading">Happyyy Girlfriend Day CHELLO!!!</h1>
        <p id="subText">Will you be my girlfriend all over again? ❤️</p>
        
        <div class="btn-wrapper" id="workSpace">
            <button id="yesBtn">YES! </button>
            <button id="noBtn">No </button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const heading = document.getElementById('questionHeading');
        const subText = document.getElementById('subText');
        const photo = document.getElementById('displayPhoto');
        const workSpace = document.getElementById('workSpace');

        let yesScale = 1;
        let clickCount = 0;

        const funnyPhrases = [
            "Are you sure? 🥺",
            "Shut up and think again! ",
            "Chumma please click Yes! ✨",
            "Ayy button is broken, Tell Yes now! 🔥",
            "Inna chello, avolothana? ❌"
        ];

        function moveNoButton(e) {
            if(e) e.preventDefault();
            
            if (noBtn.style.position !== 'absolute') {
                noBtn.style.position = 'absolute';
            }

            const spaceWidth = workSpace.clientWidth;
            const spaceHeight = workSpace.clientHeight;
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            const maxX = spaceWidth - btnWidth;
            const maxY = spaceHeight - btnHeight;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            yesScale += 0.35;
            yesBtn.style.transform = `scale(${yesScale})`;
            yesBtn.classList.add('pulse');

            if (clickCount < funnyPhrases.length) {
                subText.innerText = funnyPhrases[clickCount];
            } else {
                subText.innerText = "Resistance is futile! Just click YES! 😎";
            }
            clickCount++;
        }

        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', moveNoButton);
        noBtn.addEventListener('click', moveNoButton);

        yesBtn.addEventListener('click', () => {
            workSpace.style.display = 'none';
            heading.innerText = "YAYYYYY! ❤️💍";
            subText.innerText = "Best decision ever. I love you to the moon and back, Chellokutieee!";
            // Switches seamlessly to your uploaded celebration image
            photo.src = "us-yes.jpg"; 
        });
    </script>
</body>
</html>
