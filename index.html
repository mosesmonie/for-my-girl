<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Special Question ❤️</title>
    <!-- Premium Google Fonts for the romantic & stylish look -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Great+Vibes&family=Montserrat:wght@500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-red: #d90429;
            --dark-crimson: #800020;
            --bright-scarlet: #ef233c;
            --gold-accent: #fee440;
            --premium-black: #1a0005;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #3a0007 0%, var(--premium-black) 100%);
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            text-align: center;
            padding: 20px; 
        }

        .card-container {
            background: rgba(40, 2, 8, 0.8);
            border: 2px solid rgba(217, 4, 41, 0.4);
            padding: 35px 20px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 340px;
            z-index: 10;
            position: relative; 
            min-height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .img-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        .img-container img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 20px;
            border: 3px solid var(--primary-red);
            box-shadow: 0 8px 20px rgba(217, 4, 41, 0.4);
        }

        h1 {
            font-family: 'Cinzel Decorative', serif;
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            margin: 5px 0;
            line-height: 1.3;
            text-shadow: 0 2px 10px rgba(217, 4, 41, 0.6);
        }

        p {
            font-family: 'Great Vibes', cursive;
            color: #ffccd5;
            font-size: 1.65rem;
            line-height: 1.2;
            margin: 5px 0 15px 0;
            min-height: 45px;
            text-shadow: 0 1px 5px rgba(255, 255, 255, 0.2);
        }

        .interactive-zone {
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            margin-top: auto;
        }

        button {
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 800;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #yesBtn {
            background: linear-gradient(135deg, #38b000 0%, #007200 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(56, 176, 0, 0.4);
            z-index: 100;
            transform-origin: center center;
        }

        #noBtn {
            background: linear-gradient(135deg, var(--bright-scarlet) 0%, var(--dark-crimson) 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(217, 4, 41, 0.4);
            z-index: 9999 !important; 
            position: fixed; 
            transition: left 0.15s ease-out, top 0.15s ease-out;
        }

        .celebrate-title {
            font-family: 'Cinzel Decorative', serif !important;
            font-size: 1.8rem !important;
            color: var(--gold-accent) !important;
            text-shadow: 0 0 20px rgba(254, 228, 64, 0.6) !important;
        }
    </style>
</head>
<body>

    <div class="card-container" id="proposalCard">
        <div class="img-container" id="photoBox">
            <img id="displayPhoto" src="us-start.jpg" alt="Our Photo">
        </div>
        <h1 id="questionHeading">Happyyy Girlfriend Day CHELLO!!! 💋</h1>
        <p id="subText">Will you be my girlfriend all over again? ❤️</p>
        
        <div class="interactive-zone" id="actionArea">
            <button id="yesBtn">YES! </button>
        </div>
    </div>

    <button id="noBtn">No </button>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const heading = document.getElementById('questionHeading');
        const subText = document.getElementById('subText');
        const photo = document.getElementById('displayPhoto');
        const card = document.getElementById('proposalCard');
        const photoBox = document.getElementById('photoBox');

        let yesScale = 1;
        let clickCount = 0;

        const funnyPhrases = [
            "Are you sure? 🥺",
            "Shut up and think again! ",
            "Chumma please click Yes! ✨",
            "Ayy button is broken, Tell Yes now! 🔥",
            "Inna chello, avolothana? ❌",
            "Babyyyy how huge the YES button got! 😏",
            "Catch me if you can, my queenn! 🏃‍♀️💨"
        ];

        function initNoButtonPosition() {
            const yesRect = yesBtn.getBoundingClientRect();
            noBtn.style.left = (yesRect.right + 20) + 'px';
            noBtn.style.top = yesRect.top + 'px';
        }
        
        window.addEventListener('load', initNoButtonPosition);
        window.addEventListener('resize', initNoButtonPosition);

        function teleportNoButton(e) {
            if(e) e.preventDefault();

            const cardRect = card.getBoundingClientRect();
            const photoRect = photoBox.getBoundingClientRect();
            const headingRect = heading.getBoundingClientRect();
            const textRect = subText.getBoundingClientRect();
            const yesRect = yesBtn.getBoundingClientRect();

            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            const padding = 15;

            const minX = cardRect.left + padding;
            const maxX = cardRect.right - btnWidth - padding;
            const minY = cardRect.top + padding;
            const maxY = cardRect.bottom - btnHeight - padding;

            let randomX, randomY;
            let collisionDetected = true;
            let safetyAttempts = 0;

            while (collisionDetected && safetyAttempts < 100) {
                randomX = Math.floor(Math.random() * (maxX - minX)) + minX;
                randomY = Math.floor(Math.random() * (maxY - minY)) + minY;

                const targetRight = randomX + btnWidth;
                const targetBottom = randomY + btnHeight;
                const buffer = 8;

                function checkOverlap(rect) {
                    return !(targetRight < rect.left - buffer || 
                             randomX > rect.right + buffer || 
                             targetBottom < rect.top - buffer || 
                             randomY > rect.bottom + buffer);
                }

                if (!checkOverlap(photoRect) && !checkOverlap(headingRect) && !checkOverlap(textRect)) {
                    if (safetyAttempts > 40 || !checkOverlap(yesRect)) {
                        collisionDetected = false;
                    }
                }
                safetyAttempts++;
            }

            if (collisionDetected) {
                randomX = Math.floor(Math.random() * (maxX - minX)) + minX;
                randomY = Math.floor(yesRect.top + (Math.random() * (yesRect.height - btnHeight)));
            }

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            yesScale += 0.25;
            yesBtn.style.transform = `scale(${yesScale})`;

            if (clickCount < funnyPhrases.length) {
                subText.innerText = funnyPhrases[clickCount];
            } else {
                subText.innerText = "Give up, Chellokutieee! Just click YES alreadyy! 😎";
            }
            
            subText.style.fontFamily = "'Montserrat', sans-serif";
            subText.style.fontSize = "1.1rem";
            clickCount++;
        }

        noBtn.addEventListener('mouseenter', teleportNoButton);
        noBtn.addEventListener('touchstart', teleportNoButton, {passive: false});
        noBtn.addEventListener('click', teleportNoButton);

        yesBtn.addEventListener('click', () => {
            noBtn.style.display = 'none';
            yesBtn.style.display = 'none';
            
            heading.innerText = "YAYYYYY! ❤️💍";
            heading.classList.add('celebrate-title');
            
            subText.innerText = "Best decision ever. I love you to the moon and back, Chellokutieee!";
            subText.style.fontFamily = "'Montserrat', sans-serif";
            subText.style.fontSize = "1.1rem";
            subText.style.color = "#ffffff";
            
            photo.src = "us-yes.jpg"; 
            card.style.borderColor = "#38b000";
            card.style.boxShadow = "0 20px 40px rgba(56, 176, 0, 0.3)";
        });
    </script>
</body>
</html>
