<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Special Question ❤️</title>
    <!-- Importing premium, safe Google Fonts for the romantic & stylish look -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Great+Vibes&family=Montserrat:wght@500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-red: #d90429;
            --dark-crimson: #800020;
            --bright-scarlet: #ef233c;
            --gold-accent: #fee440;
            --premium-black: #1a0005;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #3a0007 0%, var(--premium-black) 100%);
            height: 100vh;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            text-align: center;
            padding: 20px; 
        }

        .card-container {
            background: rgba(40, 2, 8, 0.8);
            border: 2px solid rgba(217, 4, 41, 0.4);
            padding: 35px 20px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 340px;
            z-index: 10;
        }

        .img-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .img-container img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 20px;
            border: 3px solid var(--primary-red);
            box-shadow: 0 8px 20px rgba(217, 4, 41, 0.4);
        }

        h1 {
            font-family: 'Cinzel Decorative', serif; /* Grand, stylish font */
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 700;
            margin: 10px 0;
            line-height: 1.3;
            text-shadow: 0 2px 10px rgba(217, 4, 41, 0.6);
        }

        p {
            font-family: 'Great Vibes', cursive; /* Flowing, highly romantic script font */
            color: #ffccd5;
            font-size: 1.8rem; /* Scaled up because script fonts are naturally finer */
            line-height: 1.2;
            margin: 10px 0 25px 0;
            min-height: 50px;
            text-shadow: 0 1px 5px rgba(255, 255, 255, 0.2);
        }

        .interactive-zone {
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        button {
            padding: 14px 30px;
            font-size: 1.15rem;
            font-weight: 800;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #yesBtn {
            background: linear-gradient(135deg, #38b000 0%, #007200 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(56, 176, 0, 0.4);
            z-index: 100; /* Stays below the No button layer */
        }

        #noBtn {
            background: linear-gradient(135deg, var(--bright-scarlet) 0%, var(--dark-crimson) 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(217, 4, 41, 0.4);
            z-index: 9999 !important; /* Ultimate absolute top layering priority over everything */
        }

        .celebrate-title {
            font-family: 'Cinzel Decorative', serif !important;
            font-size: 1.8rem !important;
            color: var(--gold-accent) !important;
            text-shadow: 0 0 20px rgba(254, 228, 64, 0.6) !important;
        }
    </style>
</head>
<body>

    <div class="card-container" id="proposalCard">
        <div class="img-container">
            <img id="displayPhoto" src="us-start.jpg" alt="Our Photo">
        </div>
        <!-- Stylish title with added kissing emoji -->
        <h1 id="questionHeading">Happyyy Girlfriend Day CHELLO!!! 💋</h1>
        <!-- Romantic text font -->
        <p id="subText">Will you be my girlfriend all over again? ❤️</p>
        
        <div class="interactive-zone" id="actionArea">
            <button id="yesBtn">YES! </button>
            <button id="noBtn">No </button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const heading = document.getElementById('questionHeading');
        const subText = document.getElementById('subText');
        const photo = document.getElementById('displayPhoto');
        const card = document.getElementById('proposalCard');

        let yesScale = 1;
        let clickCount = 0;

        const funnyPhrases = [
            "Are you sure? 🥺",
            "Shut up and think again! ",
            "Chumma please click Yes! ✨",
            "Ayy button is broken, Tell Yes now! 🔥",
            "Inna chello, avolothana? ❌",
            "Look how huge the YES button got! 😏",
            "Catch me if you can! 🏃‍♀️💨"
        ];

        function teleportNoButton(e) {
            if(e) e.preventDefault();

            if (noBtn.style.position !== 'fixed') {
                noBtn.style.position = 'fixed';
            }

            const padding = 30;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            // Pull the exact layout bounds of the main card container
            const cardRect = card.getBoundingClientRect();
            
            let randomX, randomY;
            let overlapsCard = true;
            let safetyAttempts = 0;

            // Mathematical loop: Force the No button to regenerate its coordinates if it's over the text card
            while (overlapsCard && safetyAttempts < 100) {
                randomX = Math.max(padding, Math.floor(Math.random() * maxX));
                randomY = Math.max(padding, Math.floor(Math.random() * maxY));

                // Check if the random point is completely outside the text card box bounds
                const isOutsideX = (randomX + noBtn.offsetWidth < cardRect.left) || (randomX > cardRect.right);
                const isOutsideY = (randomY + noBtn.offsetHeight < cardRect.top) || (randomY > cardRect.bottom);

                if (isOutsideX || isOutsideY) {
                    overlapsCard = false;
                }
                safetyAttempts++;
            }

            // Move the button to the clean coordinates instantly
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            // Scale up the Yes Button smoothly
            yesScale += 0.3;
            yesBtn.style.transform = `scale(${yesScale})`;

            // Change messaging inside the romantic p element dynamically
            if (clickCount < funnyPhrases.length) {
                subText.innerText = funnyPhrases[clickCount];
            } else {
                subText.innerText = "Give up, Chellokutieee! Just click YES! 😎";
            }
            // Temporarily revert font-family on funny phrases so emojis/punches look sharp
            subText.style.fontFamily = "'Montserrat', sans-serif";
            subText.style.fontSize = "1.1rem";

            clickCount++;
        }

        noBtn.addEventListener('mouseenter', teleportNoButton);
        noBtn.addEventListener('touchstart', teleportNoButton, {passive: false});
        noBtn.addEventListener('click', teleportNoButton);

        yesBtn.addEventListener('click', () => {
            noBtn.style.display = 'none';
            yesBtn.style.display = 'none';
            
            heading.innerText = "YAYYYYY! ❤️💍";
            heading.classList.add('celebrate-title');
            
            subText.innerText = "Best decision ever. I love you to the moon and back, Chellokutieee!";
            subText.style.fontFamily = "'Montserrat', sans-serif";
            subText.style.fontSize = "1.1rem";
            subText.style.color = "#ffffff";
            
            photo.src = "us-yes.jpg"; 
            card.style.borderColor = "#38b000";
            card.style.boxShadow = "0 20px 40px rgba(56, 176, 0, 0.3)";
        });
    </script>
</body>
</html>
